name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Apply menu_item_variants migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/apply-sql-file.mjs supabase/migrations/20260914200000_add_menu_item_variants.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Generate types from live schema
        run: npx supabase gen types typescript --project-id rfugdsubimdlakmvqyjm --schema public > /tmp/generated-types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Fail if types/db.ts is out of date
        run: diff types/db.ts /tmp/generated-types.ts
